services:
  corso-tui:
    build: .
    container_name: corso-tui
    stdin_open: true
    tty: true
    volumes:
      - /mnt/corso_tui:/mnt/corso_tui
      - /mnt/corso:/mnt/corso:ro
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /mnt/corso_tui/exports
    environment:
      - TERM=xterm-256color
